<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINDS Admin — Local Prototype</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card" novalidate>
      <h1>MINDS Admin</h1>
      <p class="muted">Local staff prototype — demo data only.</p>
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password">
      </div>
      <button id="login-submit" type="submit" class="btn btn-primary">Sign in</button>
      <div id="login-error" class="notice notice-error" role="alert" hidden></div>
      <p class="demo-note">Local demo credentials: <code>admin</code> / <code>MindsDemo123!</code></p>
    </form>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <strong>MINDS Admin</strong>
        <span>local prototype</span>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/volunteers" data-nav="volunteers">Volunteers</a>
        <a href="#/trainees" data-nav="trainees">Trainees</a>
        <a href="#/attendance" data-nav="attendance">Attendance</a>
        <a href="#/fundraising" data-nav="fundraising">Fundraising</a>
        <a href="#/outings" data-nav="outings">Outings</a>
        <a href="#/trips" data-nav="trips">Overseas Trips</a>
        <a href="#/visits" data-nav="visits">House Visits</a>
      </nav>
      <div class="userbox">
        <span id="user-name" class="user-name"></span>
        <button id="logout-btn" type="button" class="btn btn-secondary">Log out</button>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
