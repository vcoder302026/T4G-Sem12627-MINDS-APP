# Publishes volunteer-app/web to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Optional repository variables (Settings → Secrets and variables → Actions →
# Variables), so web/js/config.js doesn't need editing by hand:
#   APP_ENVIRONMENT  Exp | Dev | Prod   (same convention as the other WERONE apps)
#   GAS_EXP_URL      Apps Script web app URL for Exp/Dev  (…/exec)
#   GAS_PROD_URL     Apps Script web app URL for Prod     (…/exec)
name: Volunteer app · deploy web

on:
  push:
    branches: [main]
    paths:
      - 'volunteer-app/web/**'
      - '.github/workflows/volunteer-app-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: volunteer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Tailwind CSS
        # Installs Tailwind next to the CSS so `@import "tailwindcss"` resolves.
        # If the build fails, the styles.css already in the repo is deployed instead.
        run: |
          if npm install --no-save --no-audit --no-fund tailwindcss@4 @tailwindcss/cli@4 \
             && npx tailwindcss -i web/src/input.css -o web/styles.css --minify; then
            echo "Built web/styles.css"
          else
            echo "::warning::Tailwind build failed; deploying the committed web/styles.css instead."
            git checkout -- web/styles.css
          fi
      - name: Give this deploy a fresh offline cache
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" web/sw.js
      - name: Apply environment and Apps Script URLs
        env:
          APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
          GAS_EXP_URL: ${{ vars.GAS_EXP_URL }}
          GAS_PROD_URL: ${{ vars.GAS_PROD_URL }}
        # Checks the values and gives a clear error instead of a bare "exit code 1".
        run: |
          set -e
          node - <<'EOF'
          const fs = require('fs');
          const file = 'web/js/config.js';
          let s = fs.readFileSync(file, 'utf8');
          const clean = (v) => String(v || '').trim();
          const env = clean(process.env.APP_ENVIRONMENT);
          const urlOk = (u) => /^https:\/\/script\.google\.com\/(macros|a\/macros\/[^/\s]+)\/s\/[A-Za-z0-9_-]+\/exec$/.test(u);
          const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
          if (env) {
            if (!['Exp', 'Dev', 'Prod'].includes(env)) fail(`APP_ENVIRONMENT must be Exp, Dev or Prod, but it is "${env}".`);
            s = s.replace(/^const APP_ENVIRONMENT = '[A-Za-z]*';/m, `const APP_ENVIRONMENT = '${env}';`);
          }
          for (const [name, placeholder] of [['GAS_EXP_URL', 'PASTE_EXP_DEPLOYMENT_ID'], ['GAS_PROD_URL', 'PASTE_PROD_DEPLOYMENT_ID']]) {
            const url = clean(process.env[name]);
            if (!url) continue;
            if (!urlOk(url)) fail(`${name} must be the Apps Script web app URL, like https://script.google.com/macros/s/AKfy.../exec, but it is "${url}".`);
            s = s.replace(`https://script.google.com/macros/s/${placeholder}/exec`, url);
          }
          fs.writeFileSync(file, s);
          EOF
          grep -n "APP_ENVIRONMENT = \|_API_URL = " web/js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: volunteer-app/web
      - id: deployment
        uses: actions/deploy-pages@v4
