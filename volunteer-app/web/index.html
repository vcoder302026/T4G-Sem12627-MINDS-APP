<!doctype html>
<html lang="en-SG" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>MINDS Volunteers</title>
  <meta name="description" content="Book MINDS volunteering sessions, show your QR pass and log your hours.">
  <meta property="og:title" content="MINDS Volunteers">
  <meta property="og:description" content="Book MINDS volunteering sessions, show your QR pass and log your hours.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Same theme rule as the other WERONE apps: saved choice, else the phone's setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.classList.toggle('light', !dark);
    })();
  </script>
</head>
<body class="min-h-dvh">
  <!-- Computers (1024px and wider): the menu is a sidebar. Phones: tabs under the header. -->
  <aside id="sidebar" class="app-sidebar" aria-label="Menu"></aside>

  <div class="app-shell">
    <div class="sticky top-0 z-30 shadow-sm">
      <div id="env-bar" class="w-full py-0.5 text-center text-xs font-bold uppercase tracking-widest text-white" hidden></div>
      <div id="offline-bar" class="w-full bg-slate-900 px-4 py-1 text-center text-xs font-bold text-white dark:bg-neutral-800" role="status" hidden>
        You're offline. Showing what was saved on this phone.
      </div>
      <header class="border-b border-slate-200 bg-white dark:border-neutral-900 dark:bg-neutral-950">
        <div class="app-bar flex h-16 items-center justify-between gap-2 px-4">
          <a href="#/" class="brand-link flex min-w-0 items-center gap-3">
            <span id="brand-icon" class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-200 dark:shadow-none"></span>
            <span class="min-w-0">
              <span class="block truncate text-base font-extrabold leading-tight tracking-tight text-slate-900 sm:text-lg dark:text-white">MINDS Volunteers</span>
              <span id="brand-sub" class="block truncate text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-neutral-400">Welcome</span>
            </span>
          </a>
          <div id="header-actions" class="flex shrink-0 items-center gap-0.5"></div>
        </div>
        <nav id="tabs" class="app-tabs px-4 pb-3" aria-label="Main" hidden>
          <div id="tabs-list" class="seg"></div>
        </nav>
        <nav id="subnav" class="app-subnav" aria-label="Admin pages" hidden></nav>
      </header>
    </div>

    <nav id="pagetabs" class="app-main page-tabs" aria-label="Pages in this section" hidden></nav>
    <main id="view" class="app-main px-4 pb-28 pt-5" tabindex="-1"></main>
  </div>

  <div id="toast" class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex justify-center px-4" role="status" aria-live="polite"></div>

  <noscript><p class="p-6">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
