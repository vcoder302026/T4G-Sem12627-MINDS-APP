<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1246" width="720" height="1246" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">On the day</title>
<desc id="d">Your session day in six steps: before you go, arrive early, clock in with your QR pass, stay with your trainee, clock out, give feedback.</desc>
<rect width="720" height="1246" rx="28" fill="#ffffff"/>
<text x="40" y="78" font-size="40" font-weight="800" fill="#0f172a">On the day</text>
<text x="40" y="118" font-size="22" fill="#64748b">Your volunteering session, step by step</text>
<line x1="74" y1="243.0" x2="74" y2="1083.0" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
<g>
<rect x="120" y="168" width="570" height="150" rx="22" fill="#eef2ff"/>
<circle cx="74" cy="243.0" r="34" fill="#4f46e5"/>
<text x="74" y="255.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="150" y="218" font-size="28" font-weight="800" fill="#0f172a">Before you go</text>
<text x="150" y="256" font-size="22" fill="#334155">Read about your trainee in the</text>
<text x="150" y="286" font-size="22" fill="#334155">app. Wear covered shoes.</text>
<g transform="translate(595,207.0) scale(3)" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g>
</g>
<g>
<rect x="120" y="336" width="570" height="150" rx="22" fill="#e0f2fe"/>
<circle cx="74" cy="411.0" r="34" fill="#0284c7"/>
<text x="74" y="423.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="150" y="386" font-size="28" font-weight="800" fill="#0f172a">Arrive 10–15 min early</text>
<text x="150" y="424" font-size="22" fill="#334155">Find the MINDS staff at the</text>
<text x="150" y="454" font-size="22" fill="#334155">venue and say hello.</text>
<g transform="translate(595,375.0) scale(3)" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
</g>
<g>
<rect x="120" y="504" width="570" height="150" rx="22" fill="#d1fae5"/>
<circle cx="74" cy="579.0" r="34" fill="#059669"/>
<text x="74" y="591.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="150" y="554" font-size="28" font-weight="800" fill="#0f172a">Clock in</text>
<text x="150" y="592" font-size="22" fill="#334155">Show your QR pass (Pass tab).</text>
<text x="150" y="622" font-size="22" fill="#334155">Turn your brightness up.</text>
<g transform="translate(595,543.0) scale(3)" fill="none" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></g>
</g>
<g>
<rect x="120" y="672" width="570" height="150" rx="22" fill="#fef3c7"/>
<circle cx="74" cy="747.0" r="34" fill="#d97706"/>
<text x="74" y="759.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="150" y="722" font-size="28" font-weight="800" fill="#0f172a">Stay with your trainee</text>
<text x="150" y="760" font-size="22" fill="#334155">Follow the staff's plan. Ask</text>
<text x="150" y="790" font-size="22" fill="#334155">staff whenever you're unsure.</text>
<g transform="translate(595,711.0) scale(3)" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></g>
</g>
<g>
<rect x="120" y="840" width="570" height="150" rx="22" fill="#ede9fe"/>
<circle cx="74" cy="915.0" r="34" fill="#7c3aed"/>
<text x="74" y="927.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="150" y="890" font-size="28" font-weight="800" fill="#0f172a">Clock out</text>
<text x="150" y="928" font-size="22" fill="#334155">Show your QR pass again at</text>
<text x="150" y="958" font-size="22" fill="#334155">the end of the session.</text>
<g transform="translate(595,879.0) scale(3)" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></g>
</g>
<g>
<rect x="120" y="1008" width="570" height="150" rx="22" fill="#ffe4e6"/>
<circle cx="74" cy="1083.0" r="34" fill="#e11d48"/>
<text x="74" y="1095.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
<text x="150" y="1058" font-size="28" font-weight="800" fill="#0f172a">Give feedback</text>
<text x="150" y="1096" font-size="22" fill="#334155">One minute: what helped and</text>
<text x="150" y="1126" font-size="22" fill="#334155">what to watch next time.</text>
<g transform="translate(595,1047.0) scale(3)" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g>
</g>
<text x="360.0" y="1206" font-size="21" fill="#64748b" text-anchor="middle">Questions or worries? Tell the MINDS staff straight away.</text>
</svg>
